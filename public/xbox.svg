<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Xbox console -->
  <rect x="10" y="18" width="44" height="28" rx="3" stroke="#10B981" stroke-width="2"/>
  <!-- Top panel -->
  <rect x="12" y="20" width="40" height="8" rx="1" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <!-- Ventilation -->
  <line x1="18" y1="28" x2="46" y2="28" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="18" y1="36" x2="46" y2="36" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <!-- Xbox ring -->
  <circle cx="20" cy="40" r="3" stroke="#10B981" stroke-width="1.5"/>
  <!-- Power indicator -->
  <circle cx="20" cy="40" r="1.5" fill="#10B981" opacity="0.5"/>
  <!-- Ports -->
  <line x1="44" y1="38" x2="46" y2="38" stroke="#10B981" stroke-width="1"/>
  <line x1="44" y1="42" x2="46" y2="42" stroke="#10B981" stroke-width="1"/>
</svg>