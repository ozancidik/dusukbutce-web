  <line x1="22" y1="52" x2="22" y2="56" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="26" y1="52" x2="26" y2="56" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="38" y1="52" x2="38" y2="56" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="42" y1="52" x2="42" y2="56" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- Module bands -->
  <line x1="18" y1="24" x2="46" y2="24" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <line x1="18" y1="40" x2="46" y2="40" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
